<form class="crear-equipo-card" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
  <h2 class="form-title">Actualizar Recurso</h2>

  <div class="form-row">
    <label for="select-recurso">Seleccione recurso:</label>
    <select id="select-recurso" #selectRecurso (change)="onSeleccionRecurso(selectRecurso.value)" required>
      <option value="">-- Seleccione --</option>
      <option *ngFor="let r of recursos" [value]="r.id">{{ r.nombre }} ({{ r.tipo }})</option>
    </select>
  </div>

  <div class="form-row">
    <label for="nombre">Nombre:</label>
    <input id="nombre" formControlName="nombre" required placeholder="Ej: Agua Potable" />
    <div class="error-msg" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">Nombre requerido</div>
  </div>

  <div class="form-row">
    <label for="tipo">Tipo:</label>
    <select id="tipo" formControlName="tipo" required>
      <option value="" disabled>-- Seleccione --</option>
      <option *ngFor="let t of tipos" [value]="t">{{ t }}</option>
    </select>
    <div class="error-msg" *ngIf="form.get('tipo')?.touched && form.get('tipo')?.invalid">Tipo requerido</div>
  </div>

  <div class="form-row">
    <label for="cantidad">Cantidad:</label>
    <input id="cantidad" type="number" formControlName="cantidad" required min="0" placeholder="0" />
    <div class="hint">Ingrese unidades disponibles</div>
  </div>

  <div class="form-row">
    <label for="ubicacion">Ubicación:</label>
    <select id="ubicacion" formControlName="ubicacionSeleccionada" required>
      <option value="" disabled>Seleccione una ubicación</option>
      <option *ngFor="let u of ubicaciones" [value]="u.id">{{ u.nombre }}</option>
    </select>
    <button type="button" class="btn btn-outline" (click)="toggleDetalles()" style="margin-top: 8px;">{{ showDetallesUbicacion ? 'Ocultar detalles' : 'Mostrar detalles' }}</button>
    <div class="hint">Debe seleccionar una ubicación existente.</div>
  </div>

  <!-- Detalles de la ubicación (ocultos por defecto) -->
  <div *ngIf="showDetallesUbicacion" formGroupName="ubicacion" style="margin-top: 12px; padding: 12px; background: #f7fafd; border-radius: 4px; border: 1px solid #e0e7ef;">
    <div class="form-row">
      <label>Nombre ubicación:</label>
      <input formControlName="nombre" readonly />
    </div>
    <div class="form-row">
      <label>Calle:</label>
      <input formControlName="calle" readonly />
    </div>
    <div class="form-row">
      <label>Carrera:</label>
      <input formControlName="carrera" readonly />
    </div>
    <div class="form-row">
      <label>Tipo:</label>
      <input formControlName="tipoUbicacion" readonly />
    </div>
  </div>

  <div class="actions">
    <button class="primary" type="submit" [disabled]="submitting || form.invalid || !selectedResourceId">{{ submitting ? 'Actualizando…' : 'Actualizar' }}</button>
  </div>

  <div *ngIf="successMessage" class="exito estado">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="error estado">{{ errorMessage }}</div>
</form>
