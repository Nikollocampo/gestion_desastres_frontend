<form #equipoForm="ngForm" (ngSubmit)="crearEquipo(equipoForm)">
  <div>
    <label>ID del equipo:</label>
    <input [(ngModel)]="equipo.idEquipo" name="idEquipo" required />
  </div>
  <div>
    <label>Tipo de equipo:</label>
    <select [(ngModel)]="equipo.tipoEquipo" name="tipoEquipo" required>
      <option value="" disabled selected>Selecciona un tipo</option>
      <option value="BOMBEROS">Bomberos</option>
      <option value="MEDICOS">Médicos</option>
      <option value="POLICIAS">Policías</option>
    </select>
  </div>
  <div>
    <label>Integrantes disponibles:</label>
    <input type="number" [(ngModel)]="equipo.integrantesDisponibles" name="integrantesDisponibles" required min="1" />
  </div>
  <div>
    <label>Ubicación:</label>
    <select [(ngModel)]="equipo.ubicacionId" name="ubicacionId" required>
      <option value="" disabled selected>Selecciona una ubicación</option>
      <option *ngFor="let u of ubicaciones" [value]="u.id">{{ u.nombre }} - {{ u.id }}</option>
    </select>
  </div>
  <button type="submit" [disabled]="loading">{{ loading ? 'Añadiendo...' : 'Añadir Equipo' }}</button>
</form>
<div *ngIf="mensaje" [ngClass]="{'exito': exito, 'error': exito === false}">{{ mensaje }}</div>
