<div class="ubicaciones-container">
  <!-- Título eliminado -->
  <div *ngIf="cargando">Cargando ubicaciones...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <!-- Tabla eliminada, solo mensajes de carga, error y vacío -->
  <div *ngIf="!cargando && ubicaciones.length === 0">No hay ubicaciones registradas.</div>
</div>
