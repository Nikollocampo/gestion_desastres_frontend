<div class="registrar-desastre-container">
  <h2>Registrar Desastre</h2>
  <form #form="ngForm" (ngSubmit)="registrar(form)">
    <div>
      <label for="nombre">Nombre:</label>
      <input id="nombre" name="nombre" [(ngModel)]="nombre" required maxlength="80" />
    </div>

    <div>
      <label for="tipoDesastre">Tipo de Desastre:</label>
      <select id="tipoDesastre" name="tipoDesastre" [(ngModel)]="tipoDesastre" required>
        <option value="" disabled selected>Seleccione un tipo</option>
        <option value="INCENDIO">Incendio</option>
        <option value="DERRUMBE">Derrumbe</option>
        <option value="TEMBLOR">Temblor</option>
        <option value="INUNDACION">Inundación</option>
      </select>
    </div>

    <div>
      <label for="magnitud">Magnitud:</label>
      <input id="magnitud" name="magnitud" type="number" [(ngModel)]="magnitud" min="0" step="0.01" />
    </div>

    <div>
      <label for="personasAfectadas">Personas afectadas:</label>
      <input id="personasAfectadas" name="personasAfectadas" type="number" [(ngModel)]="personasAfectadas" min="0" />
    </div>

    <div>
      <label for="fecha">Fecha:</label>
      <input id="fecha" name="fecha" type="date" [(ngModel)]="fecha" />
    </div>

    <div>
      <label for="idUbicacion">Ubicación:</label>
      <select id="idUbicacion" name="idUbicacion" [(ngModel)]="idUbicacion" required>
        <option value="" disabled selected>Seleccione ubicación</option>
        <option *ngFor="let u of ubicaciones" [value]="u.id">{{ u.nombre }}</option>
      </select>
    </div>

    

    <button type="submit" [disabled]="cargando || form.invalid">Registrar</button>
  </form>

  <div *ngIf="mensaje" class="mensaje">{{ mensaje }}</div>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>
