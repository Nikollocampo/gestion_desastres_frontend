<form class="definir-ruta-card" #rutaForm="ngForm" (ngSubmit)="definirRuta(rutaForm)" autocomplete="off">
  <h2 class="form-title">Definir ruta</h2>

  <div class="form-row">
    <label for="origen">Origen:</label>
    <select id="origen" [(ngModel)]="origenId" name="origenId" required>
      <option value="" disabled selected>Selecciona origen</option>
      <option *ngFor="let u of ubicaciones" [value]="u.id">{{ u.nombre }}</option>
    </select>
  </div>

  <div class="form-row">
    <label for="destino">Destino:</label>
    <select id="destino" [(ngModel)]="destinoId" name="destinoId" required>
      <option value="" disabled selected>Selecciona destino</option>
      <option *ngFor="let u of ubicaciones" [value]="u.id">{{ u.nombre }}</option>
    </select>
  </div>

  <div class="actions">
    <button class="primary" type="submit" [disabled]="loading">{{ loading ? 'Definiendo…' : 'Definir ruta' }}</button>
  </div>

  <div *ngIf="mensaje" [ngClass]="{'error': !resultado || resultado?.exito === false, 'mensaje': resultado?.exito}" class="estado">{{ mensaje }}</div>
</form>

<div *ngIf="resultado && resultado.exito" class="modal-flotante-backdrop">
  <div class="modal-flotante">
    <button class="cerrar-modal" (click)="resultado = null" title="Cerrar">×</button>
    <h3>Ruta definida correctamente</h3>
    <ul>
      <li><b>Origen:</b> {{ resultado.origen?.nombre }}</li>
      <li><b>Destino:</b> {{ resultado.destino?.nombre }}</li>
      <li><b>Distancia:</b> {{ resultado.distancia }} km</li>
      <li><b>Peso:</b> {{ resultado.peso }}</li>
      <li><b>Camino:</b> {{ resultado.camino?.join(' → ') }}</li>
    </ul>
  </div>
</div>
