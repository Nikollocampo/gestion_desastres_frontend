<div class="rutas-container">
  <h2>Lista de Rutas de Transporte</h2>
  <div *ngIf="cargando">Cargando rutas...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <table *ngIf="!cargando && rutas.length > 0">
    <thead>
      <tr>
        <th>Nombre Origen</th>
        <th>Nombre Destino</th>
        <th>Distancia (km)</th>
        <th>Peso</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let ruta of pagedRutas">
        <td>{{ ruta.origen.nombre }}</td>
        <td>{{ ruta.destino.nombre }}</td>
        <td>{{ ruta.distancia }}</td>
        <td>{{ ruta.peso }}</td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="!cargando && rutas.length === 0">No hay rutas registradas.</div>

  <div *ngIf="!cargando && rutas.length > 0" class="pager-center">
    <button (click)="prevPage()" [disabled]="page === 1">Anterior</button>
    <span>Página {{ page }} de {{ totalPages }}</span>
    <button (click)="nextPage()" [disabled]="page === totalPages">Siguiente</button>
  </div>
</div>
